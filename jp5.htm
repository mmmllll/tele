<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes,maximum-scale=5.0">
<title>电报@gv419-精品5-网速决定加载速度</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}
body {
  background: #f5f5f5;
  padding: 8px;
  -webkit-touch-callout: none;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 4px;
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
}

/* 小图水印：紧凑集中在中间 */
.watermark-wrap {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px; /* 水印间距 近一点 */
}
.wm {
  font-size: 13px;
  color: #000;
  opacity: 0.18;
  white-space: nowrap;
}

/* 放大弹窗 */
.lightbox {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  z-index: 9999;
  align-items: center;
  justify-content: center;
}
.lightbox-img {
  max-width: 100%;
  max-height: 100vh;
  object-fit: contain;
  pointer-events: none;
}

/* 大图水印：紧凑集中在中间 */
.lightbox-wm {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px; /* 大图水印间距 */
}
.lw {
  font-size: 34px;
  color: #fff;
  opacity: 0.15;
  white-space: nowrap;
}

/* 按钮 */
.btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 22px;
  z-index: 10;
}
.prev { left: 10px; }
.next { right: 10px; }
.close {
  top: 20px;
  right: 20px;
  transform: none;
}
</style>
</head>
<body oncontextmenu="return false;">

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">

  <button class="btn next" id="nextBtn">→</button>
  <img class="lightbox-img" id="lightboxImg">
  <div class="lightbox-wm">
    <div class="lw"></div>
    <div class="lw"></div>
    <div class="lw"></div>
  </div>
</div>

    const item = document.createElement('div');
    item.className = 'gallery-item';
    
    const img = document.createElement('img');
    img.dataset.src = url;
    img.loading = 'lazy';
    
    // 紧凑水印
    const wms = `
      <div class="watermark-wrap">
        <div class="wm" style="opacity:${OPACITY_SMALL}">${WATERMARK}</div>
        <div class="wm" style="opacity:${OPACITY_SMALL}">${WATERMARK}</div>
        <div class="wm" style="opacity:${OPACITY_SMALL}">${WATERMARK}</div>
      </div>
    `;
    
    item.innerHTML = wms;
    item.prepend(img);
    item.onclick = () => open(i);
    gallery.appendChild(item);
  });

  // 懒加载
  const imgs = document.querySelectorAll('img[data-src]');
  const io = new IntersectionObserver(e => {
    e.forEach(en => en.isIntersecting && (en.target.src = en.target.dataset.src));
  }, { rootMargin: '200px' });
  imgs.forEach(i => io.observe(i));
}

function open(idx) {
  currentIndex = idx;
  lightboxImg.src = imgUrls[idx];
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function close() {
  lightbox.style.display = 'none';
  document.body.style.overflow = '';
}

function prev() {
  if (currentIndex > 0) lightboxImg.src = imgUrls[--currentIndex];
}
function next() {
  if (currentIndex < imgUrls.length-1) lightboxImg.src = imgUrls[++currentIndex];
}

document.getElementById('closeBtn').onclick = close;
document.getElementById('prevBtn').onclick = prev;
document.getElementById('nextBtn').onclick = next;
lightbox.onclick = e => e.target === lightbox && close();

document.onkeydown = e => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'ArrowRight') next();
  if (e.key === 'Escape') close();
};

init();
</script>
</body>
</html>
